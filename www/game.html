<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>모두의 딱지치기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#2a1d12;overflow:hidden;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;user-select:none;touch-action:none}
  #cv{display:block;position:fixed;inset:0;margin:auto}
  .ui{position:fixed;left:0;right:0;pointer-events:none;color:#fff;text-align:center;z-index:5}
  #topbar{top:calc(env(safe-area-inset-top,0px) + 10px);font-size:15px;font-weight:800;text-shadow:0 2px 4px #000;display:flex;justify-content:space-around;align-items:center;padding:0 14px}
  #topbar .pill{background:rgba(0,0,0,.35);border-radius:20px;padding:6px 14px;min-width:70px}
  #topbar .k{font-size:10px;opacity:.7;font-weight:600;display:block}
  #ver{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10px;color:#8a6b4a;z-index:6}
  #msg{top:38%;font-size:30px;font-weight:900;text-shadow:0 3px 0 #0007;transition:opacity .2s;opacity:0}
  #sub{top:calc(38% + 40px);font-size:15px;font-weight:700;color:#ffe9b0;text-shadow:0 2px 3px #000;opacity:0;transition:opacity .2s}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 26px);font-size:15px;font-weight:800;color:#ffe9b0;text-shadow:0 2px 4px #000;animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 50% 20%,#3a281700,#1a110a 90%);color:#fff;text-align:center;padding:24px}
  #start h1{font-size:46px;font-weight:900;color:#ffcf5c;text-shadow:0 0 2px #7a4a12,4px 4px 0 #7a4a12;letter-spacing:-1px}
  #start p{font-size:15px;line-height:1.7;color:#e9d6bf;max-width:300px}
  #start .btn{pointer-events:auto;margin-top:8px;background:#ffcf5c;color:#5a3a10;font-size:22px;font-weight:900;border:none;border-radius:16px;padding:16px 46px;box-shadow:0 6px 0 #b5831f;cursor:pointer}
  #start .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b5831f}
  #foeLabel{top:calc(env(safe-area-inset-top,0px) + 54px);font-size:16px;font-weight:800;text-shadow:0 2px 4px #000}
  #dexBtn,#dexBtn2{pointer-events:auto;position:fixed;background:rgba(22,16,10,.75);color:#ffcf5c;border:1px solid #6a4e2a;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer;z-index:8}
  #dexBtn{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  #dexBtn2{position:static;margin-top:4px}
  #rewardBtn{pointer-events:auto;position:fixed;left:50%;transform:translateX(-50%);top:54%;background:#2ec77a;color:#fff;border:none;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #1a8a52;cursor:pointer;z-index:9}
  #rewardBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #1a8a52}
  #dex{position:fixed;inset:0;z-index:12;background:rgba(18,12,7,.96);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 20px;overflow-y:auto}
  #dex h2{font-size:24px;color:#ffcf5c;margin-bottom:4px}
  #dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(94vw,440px);margin:12px 0}
  .dcard{background:#20160d;border:1px solid #3a2a18;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;font-weight:700}
  .dcard .nm{margin-top:4px;color:#e9d6bf}
  .dcard .cnt{font-size:10px;color:#9a815f}
  .dcard.lk{opacity:.45}
  #dexClose,#adov{pointer-events:auto}
  #dexClose{margin-top:6px;background:#ffcf5c;color:#5a3a10;border:none;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #b5831f;cursor:pointer}
  #adov{position:fixed;inset:0;z-index:20;background:rgba(5,4,2,.93);color:#ffcf5c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:18px;font-weight:800}
  #adov .sp{width:40px;height:40px;border:5px solid rgba(255,255,255,.15);border-top-color:#ffcf5c;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #coinHud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 52px);font-size:14px;font-weight:800;color:#ffd75c;text-shadow:0 2px 3px #000;z-index:6;pointer-events:none}
  #shopBtnP{pointer-events:auto;position:fixed;right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(22,16,10,.75);color:#8affb0;border:1px solid #2a6a40;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;cursor:pointer;z-index:8}
  #shopBtn2{pointer-events:auto;background:#20263c00;color:#8affb0;border:1px solid #2a6a40;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:800;cursor:pointer;margin-top:2px}
  #shop{position:fixed;inset:0;z-index:12;background:rgba(18,12,7,.97);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 20px;overflow-y:auto}
  #shop h2{font-size:24px;color:#8affb0;margin-bottom:2px}
  #shopCoins{font-size:15px;color:#ffd75c;font-weight:800;margin-bottom:10px}
  .urow{display:flex;align-items:center;gap:8px;width:min(94vw,440px);background:#20160d;border:1px solid #3a2a18;border-radius:12px;padding:10px 12px;margin:5px 0;text-align:left}
  .urow .ui2{flex:1;min-width:0}
  .urow .un{font-size:15px;font-weight:800}
  .urow .ud{font-size:11px;color:#9a815f;margin-top:2px}
  .urow .lv{font-size:11px;color:#8affb0;margin-top:2px;font-weight:700}
  .urow .ub{background:#2ec77a;color:#fff;border:none;border-radius:10px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer;pointer-events:auto;white-space:nowrap}
  .urow .ub:disabled{background:#4a4030;color:#998;cursor:default}
  #shopClose{margin-top:8px;background:#ffcf5c;color:#5a3a10;border:none;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #b5831f;cursor:pointer;pointer-events:auto}
  .hidden{display:none!important}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="ui" id="topbar">
  <div class="pill"><span class="k">점수</span><span id="score">0</span></div>
  <div class="pill"><span class="k">스테이지</span><span id="stage">1</span></div>
  <div class="pill"><span class="k">연속</span><span id="combo">0</span></div>
  <div class="pill"><span class="k">최고</span><span id="best">0</span></div>
</div>
<div class="ui" id="foeLabel"></div>
<div class="ui" id="msg"></div>
<div class="ui" id="sub"></div>
<div class="ui hidden" id="hint">화면을 탭해서 내리쳐요!</div>
<div id="coinHud" class="hidden"></div>
<button id="dexBtn" class="hidden">📖 도감</button>
<button id="shopBtnP" class="hidden">🔨 강화</button>
<button id="rewardBtn" class="hidden"></button>
<div id="shop" class="hidden">
  <h2>🔨 딱지 강화</h2>
  <div id="shopCoins"></div>
  <div id="shopRows"></div>
  <button id="shopClose">닫기</button>
</div>
<div id="dex" class="hidden">
  <h2>📖 딱지 도감</h2>
  <div id="dexCount" style="font-size:13px;color:#e9d6bf"></div>
  <div id="dexGrid"></div>
  <button id="dexClose">닫기</button>
</div>
<div id="adov" class="hidden"><div class="sp"></div><div id="adovTxt">광고 보는 중…</div></div>
<div id="ver">모두의 딱지치기 v0.6</div>
<div id="start">
  <h1 style="font-size:38px">모두의 딱지치기</h1>
  <p>초록 구간에서 <b>탭</b>해서 딱지를 내리쳐요.<br/>상대 딱지가 <b>90°를 넘기면</b> 뒤집혀서 따먹어요!<br/>스테이지 올라갈수록 <b>초록은 좁아지고 파워바는 빨라져요</b> 🟫<br/><span id="bstage" style="color:#ffcf5c;font-weight:800"></span></p>
  <button class="btn" id="startBtn">시작</button>
  <div style="display:flex;gap:10px">
    <button id="dexBtn2">📖 도감</button>
    <button id="shopBtn2">🔨 강화</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// ---- Audio (code-gen, no files) ----
let AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type,g,slide){ if(!AC) return; const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),AC.currentTime+d); v.gain.value=g||0.15; v.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }
function noise(d,g){ if(!AC) return; const n=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,n,AC.sampleRate), dt=buf.getChannelData(0); for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(); s.buffer=buf; const v=AC.createGain(); v.gain.value=g||0.3; s.connect(v); v.connect(AC.destination); s.start(); }
const sfx={ slam(){ noise(0.18,0.5); tone(90,0.18,'square',0.25,40); }, whoosh(){ tone(300,0.25,'sine',0.08,700); }, teeter(){ tone(520,0.07,'sine',0.08); }, win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.18),i*80)); }, fail(){ tone(180,0.3,'sawtooth',0.18,70); noise(0.2,0.25); }, vib(ms){ try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){} } };

// ---- State ----
let state='start'; // start | ready | slam | flip | result
let score=0, combo=0, won=0, best=0, stage=1, bestStage=1;
try{ best=parseInt(localStorage.getItem('ddakji_best')||'0')||0; bestStage=parseInt(localStorage.getItem('ddakji_bstage')||'1')||1; }catch(e){}
let power=0, pdir=1;                 // 파워 바 (0..1 핑퐁)
let GREEN=[0.70,0.92];              // 성공 구간(초록). 스테이지별로 좁아지고 위로. 아래 0.5~0.69는 '아깝다' 니어미스
let barSpeed=1.35;                  // 파워바 속도(스테이지↑ = 빨라짐)
function applyDifficulty(){ const s=stage;
  barSpeed=Math.min(3.0, 1.2 + (s-1)*0.12) * (1 - up.barslow*0.08);  // 스테이지↑ 빠르게 · 집중력 강화로 감속
  Gcur=Math.min(13.5, 9 + (s-1)*0.42);                 // 딱지 점점 무겁게 → 뒤집기 임계 힘 상승
  const pstar=(Math.sqrt(2*Gcur)-1.5-powBonus())/4.6;  // 임계 파워(ω0=1.5+power*4.6+힘강화 기준)
  GREEN=[ Math.max(0.40, Math.min(0.90, pstar+0.095-aimBonus())), 1.0 ]; // 초록=실제 성공구간. 힘/정확도 강화로 넓어짐
}
let theta=0, omega=0, maxTheta=0;   // 뒤집기 물리(라디안, 0=평평, PI=뒤집힘)
let Gcur=9.0;                       // 중력 토크(=딱지 무게). 스테이지↑ = 무거워짐 = 더 센 힘 필요
let slamT=0, resultT=0, shake=0, flash=0, gt=0;
let lastPower=0, perfectHit=false, teetering=false, teetDeg=0;
let parts=[];                       // 먼지/파편
let dropY=0;                        // 내리치는 딱지 낙하
// ---- 딱지 도감(레어도) ----
const DDAKJI=[
  {id:'red',   name:'빨강 딱지', cols:['#e8534e','#b23a36'], rarity:'c'},
  {id:'blue',  name:'파랑 딱지', cols:['#4e86e8','#3a62b2'], rarity:'c'},
  {id:'green', name:'초록 딱지', cols:['#4eb86a','#36934f'], rarity:'c'},
  {id:'yellow',name:'노랑 딱지', cols:['#e8b24e','#b2832f'], rarity:'c'},
  {id:'purple',name:'보라 딱지', cols:['#a24ee8','#7a36b2'], rarity:'c'},
  {id:'sky',   name:'하늘 딱지', cols:['#3fb8c8','#2a8794'], rarity:'c'},
  {id:'tiger', name:'호랑이 딱지', cols:['#ff8a2a','#1c1c1c'], rarity:'r'},
  {id:'magpie',name:'까치 딱지', cols:['#e9edf2','#20242c'], rarity:'r'},
  {id:'rose',  name:'무궁화 딱지', cols:['#ff7ab0','#b23a6e'], rarity:'r'},
  {id:'taeguk',name:'태극 딱지', cols:['#e5464e','#2a52be'], rarity:'r'},
  {id:'gold',  name:'황금 딱지', cols:['#ffd75c','#bb8a1a'], rarity:'e'},
  {id:'dragon',name:'용 딱지',   cols:['#38e0c8','#c9a227'], rarity:'e'},
];
const RINFO={ c:{label:'',       stars:'',    mult:1, color:'#cdbfa6'},
             r:{label:'✨ 레어',  stars:'★★',  mult:2, color:'#7cf6ff'},
             e:{label:'👑 전설',  stars:'★★★', mult:3, color:'#ffcf5c'} };
let foe=DDAKJI[0];                   // 이번 라운드 상대 딱지
let owned={};                        // 도감: id→획득수
try{ owned=JSON.parse(localStorage.getItem('ddakji_dex')||'{}')||{}; }catch(e){}
function saveDex(){ try{ localStorage.setItem('ddakji_dex',JSON.stringify(owned)); }catch(e){} }
function pickFoe(){ const s=stage;
  let rare=0.14+Math.min(0.20,s*0.01), epic=0.03+Math.min(0.09,s*0.006); // 스테이지↑ = 레어/전설 확률↑
  const roll=Math.random(); let tier = roll<epic?'e' : roll<epic+rare?'r' : 'c';
  const pool=DDAKJI.filter(d=>d.rarity===tier); return pool[Math.floor(Math.random()*pool.length)];
}
let lastGain=0, rewardUsed=false, lastSuccess=false, easyNext=false, foeGlow=0;

// ---- 엽전 & 딱지 강화(영구 성장) ----
let coins=0, up={power:0,aim:0,barslow:0,coin:0};
try{ coins=parseInt(localStorage.getItem('ddakji_coins')||'0')||0; up=Object.assign(up,JSON.parse(localStorage.getItem('ddakji_up')||'{}')); }catch(e){}
function saveCoins(){ try{ localStorage.setItem('ddakji_coins',coins); localStorage.setItem('ddakji_up',JSON.stringify(up)); }catch(e){} }
const UPG=[
  {id:'power',  name:'💪 내려치는 힘', desc:'뒤집기에 필요한 힘 ↓ (초록 넓어짐)', max:5, cost:l=>40+l*45},
  {id:'aim',    name:'🎯 정확도',     desc:'초록 성공 구간이 더 넓어져요', max:5, cost:l=>40+l*45},
  {id:'barslow',name:'🐢 집중력',     desc:'파워바가 느려져 맞추기 쉬워요', max:4, cost:l=>60+l*70},
  {id:'coin',   name:'🪙 엽전 복',    desc:'엽전 획득량이 늘어나요', max:5, cost:l=>50+l*55},
];
function powBonus(){ return up.power*0.28; }         // ω0 보너스
function aimBonus(){ return up.aim*0.016; }          // 초록 하한 ↓(넓어짐)
function coinMult(){ return 1 + up.coin*0.3; }

function $(id){ return document.getElementById(id); }
function setTop(){ $('score').textContent=score; $('combo').textContent=combo; $('stage').textContent=stage; $('best').textContent=best; const ch=$('coinHud'); if(ch) ch.textContent='🪙 '+coins; }
function showMsg(t,c){ const m=$('msg'); m.textContent=t; m.style.color=c||'#fff'; m.style.opacity=1; }
function showSub(t){ const s=$('sub'); s.textContent=t||''; s.style.opacity=t?1:0; }
function clearMsg(){ $('msg').style.opacity=0; $('sub').style.opacity=0; }

function newRound(keepFoe){ if(!keepFoe) foe=pickFoe(); theta=0; omega=0; maxTheta=0; power=0; pdir=1; rewardUsed=false; applyDifficulty();
  if(easyNext){ GREEN=[Math.max(0.48,GREEN[0]-0.15),1.0]; easyNext=false; }   // 리워드 '쉽게 다시' 1회 적용
  const ri=RINFO[foe.rarity]; foeGlow=foe.rarity==='c'?0:1;
  $('foeLabel').innerHTML=(ri.label?('<span style="color:'+ri.color+'">'+ri.label+' '+ri.stars+'</span> '):'')+foe.name;
  $('rewardBtn').classList.add('hidden'); $('dexBtn').classList.remove('hidden'); $('shopBtnP').classList.remove('hidden');
  state='ready'; clearMsg(); $('hint').classList.remove('hidden');
}

function slam(){
  if(state!=='ready') return;
  state='slam'; slamT=0; dropY=-220; $('hint').classList.add('hidden');
  initAudio(); sfx.whoosh();
}
function doImpact(){
  shake=10; flash=0.5; sfx.slam(); sfx.vib(30);
  for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*3; parts.push({x:0,y:0,vx:Math.cos(a)*sp,vy:-Math.random()*4-1,life:0.5,r:2+Math.random()*3}); }
  // 파워 → 초기 각속도(ω0). 임계값 sqrt(2G)=~4.24 를 넘겨야 90° 통과
  omega = 1.5 + power*4.6 + powBonus();   // 힘 강화 시 더 잘 넘어감
  lastPower=power; perfectHit = power >= Math.min(0.97, GREEN[0] + (1-GREEN[0])*0.68);  // 초록 상단부 명중 = 완벽타
  theta=0.001; maxTheta=0; teetering=false; state='flip';
}

function setReward(txt){ const b=$('rewardBtn'); b.textContent=txt; b.classList.remove('hidden'); }
function endFlip(success){
  state='result'; resultT=0; lastSuccess=success; rewardUsed=false;
  const deg=Math.round(maxTheta*180/Math.PI); const ri=RINFO[foe.rarity];
  if(success){
    won++; combo++; const pf=perfectHit;
    let gain=Math.round((10+stage*3+combo*2)*ri.mult); if(pf) gain=Math.round(gain*1.5); lastGain=gain; score+=gain;
    const first=!(owned[foe.id]>0); owned[foe.id]=(owned[foe.id]||0)+1; saveDex();
    let earn=Math.round((3+stage)*ri.mult*coinMult()); if(pf) earn=Math.round(earn*1.5); coins+=earn; saveCoins();
    if(score>best){ best=score; try{localStorage.setItem('ddakji_best',best);}catch(e){} }
    stage++; if(stage>bestStage){ bestStage=stage; try{localStorage.setItem('ddakji_bstage',bestStage);}catch(e){} }
    showMsg(foe.rarity==='e'?'전설 획득! 👑':foe.rarity==='r'?'레어 획득! ✨':(pf?'완벽하게 뒤집었다! 🎯':'뒤집기 성공! 🟫'), pf?'#ffe14d':(ri.mult>1?ri.color:'#aef5b0'));
    showSub((pf?'✨완벽타 x1.5 ':'')+(first?'🆕 새 딱지! ':'')+foe.name+' +'+gain+'점 · 🪙+'+earn+(ri.mult>1?' (x'+ri.mult+')':'')+' · STAGE '+stage);
    sfx.win(); sfx.vib([20,40,30]); shake=9; sfx.slam();   // 착지 쿵
    for(let i=0;i<10;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.2, sp=1+Math.random()*3; parts.push({x:(Math.random()-.5)*60,y:30,vx:Math.cos(a)*sp,vy:-Math.random()*3-1,life:0.5,r:2+Math.random()*3}); }
    const cc=pf?['#ffe14d','#fff','#ffcf5c','#ffb04a']:(foe.rarity==='c'?['#ffcf5c','#ff7a5c','#5cff9e','#5cc8ff']:[ri.color,'#ffffff',ri.color,'#ffe9b0']);
    const n=pf?64:(foe.rarity==='c'?30:50); for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*(pf?6:5); parts.push({x:0,y:-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:0.9,r:3+Math.random()*4,c:cc[i%4]}); }
    setReward('🎬 광고 보고 점수 2배');
  } else {
    combo=0; const lack=Math.max(1,90-deg); const nearly=deg>=82;
    showMsg(nearly?'으악! 거의 넘어갔는데! 😣':'아깝다! 😫', nearly?'#ff7a7a':'#ff9a9a');
    showSub((nearly? `90°까지 딱 ${lack}°!! 한 번만 더!` : deg>=70?`${deg}°까지… 조금만 더 세게!`:`${deg}°… 힘이 부족했어요`)+' · '+foe.name);
    sfx.fail(); sfx.vib(nearly?[40,30,60]:60); if(nearly){ shake=7; flash=0.25; }
    setReward('🎬 광고 보고 쉽게 다시');
  }
  setTop();
}

function update(dt){
  gt+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(flash>0) flash=Math.max(0,flash-dt*2);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=dt; } parts=parts.filter(p=>p.life>0);

  if(state==='ready'){
    power+=pdir*dt*barSpeed; if(power>=1){power=1;pdir=-1;} else if(power<=0){power=0;pdir=1;}
  } else if(state==='slam'){
    slamT+=dt; dropY=-220*(1-Math.min(1,slamT/0.22))**1.4 + Math.min(1,slamT/0.22)*0;
    dropY=-220*(1-Math.min(1,slamT/0.22)); if(slamT>=0.22){ dropY=0; doImpact(); }
  } else if(state==='flip'){
    // 티핑포인트(90°) 근처에서 느리게 넘어가면 슬로모션 → "넘어갈 듯 말 듯" 긴장 극대화
    const degNow=theta*180/Math.PI;
    const nearTip = degNow>68 && degNow<112 && Math.abs(omega)<2.7;
    const slow = nearTip ? 0.33 : 1;
    if(nearTip && !teetering){ teetering=true; sfx.teeter(); }
    else if(!nearTip) teetering=false;
    teetDeg=Math.round(degNow);
    // 역진자: 평형 0·π(안정), π/2(불안정 정점). α=-G·cos(θ)
    const edt=dt*slow; const steps=4; const h=edt/steps;
    for(let i=0;i<steps;i++){
      const a=-Gcur*Math.cos(theta);
      omega+=a*h; omega*=0.999; theta+=omega*h;
      if(theta>maxTheta) maxTheta=theta;
    }
    if(nearTip && Math.random()<0.4) sfx.teeter();
    if(theta>=Math.PI){ theta=Math.PI; teetering=false; endFlip(true); }
    else if(theta<=0 && omega<=0){ theta=0; teetering=false; endFlip(false); }
  } else if(state==='result'){
    resultT+=dt;
  }
}

// ---- Render ----
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawDdakji(cx,cy,size,th,cols,flippedFaceUp){
  // th: 0=평평(윗면), PI=완전히 뒤집힘(아랫면). 세로 스케일=|cos|, 들림 높이=sin
  const sc=Math.abs(Math.cos(th));
  const lift=Math.sin(th)*size*0.5;
  const faceUp = th<Math.PI/2;   // 윗면 보이는 중
  const c = faceUp?cols:[cols[1],cols[0]];
  const h=size*sc;
  const y=cy-lift;
  ctx.save();
  // 그림자 (들릴수록 작고 흐려짐)
  ctx.globalAlpha=0.3*(1-Math.sin(th)*0.6); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,cy+size*0.52,size*0.56*(1-sc*0.2),size*0.14,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  // 접힌 종이 딱지 몸통(정사각 느낌, 세로눌림)
  const w=size*1.08;
  const grad=ctx.createLinearGradient(cx-w/2,y-h/2,cx+w/2,y+h/2); grad.addColorStop(0,c[0]); grad.addColorStop(1,c[1]);
  ctx.fillStyle=grad; roundRect(cx-w/2,y-h/2,w,Math.max(3,h),Math.min(10,h/2)); ctx.fill();
  // 대각선 접힘 무늬
  if(h>8){ ctx.save(); ctx.beginPath(); roundRect(cx-w/2,y-h/2,w,h,Math.min(10,h/2)); ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-w/2,y); ctx.lineTo(cx+w/2,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y-h/2); ctx.lineTo(cx,y+h/2); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx-w/2,y-h/2); ctx.lineTo(cx+w/2,y+h/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+w/2,y-h/2); ctx.lineTo(cx-w/2,y+h/2); ctx.stroke();
    ctx.restore();
    // 중앙 무늬 점
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(cx,y,Math.min(w,h)*0.14,0,Math.PI*2); ctx.fill();
  }
  // 윗면 하이라이트
  ctx.globalAlpha=0.25; ctx.fillStyle='#fff'; roundRect(cx-w/2+3,y-h/2+2,w-6,Math.max(2,h*0.3),4); ctx.fill(); ctx.globalAlpha=1;
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // 바닥(흙/마당)
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#4a3420'); bg.addColorStop(0.5,'#5c4028'); bg.addColorStop(1,'#3a281a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 바닥 질감 점
  ctx.fillStyle='rgba(0,0,0,.08)'; for(let i=0;i<40;i++){ const x=(i*97%W), y=(i*53%H); ctx.fillRect(x,y,3,3); }

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const CX=W/2, CY=H*0.46, SZ=Math.min(W*0.26,120);

  // 바닥 원(치는 자리)
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.arc(CX,CY+SZ*0.5,SZ*1.3,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  // 레어/전설 딱지 오라
  if(foe.rarity!=='c'){ const ri=RINFO[foe.rarity]; const pulse=0.5+0.4*Math.sin(gt*5);
    ctx.save(); ctx.globalAlpha=pulse*0.55; ctx.fillStyle=ri.color;
    ctx.beginPath(); ctx.arc(CX,CY-Math.sin(theta)*SZ*0.5,SZ*(1.05+pulse*0.12),0,Math.PI*2); ctx.fill(); ctx.restore(); }

  // 상대 딱지
  drawDdakji(CX,CY,SZ,theta,foe.cols);

  // 내리치는 내 딱지 (slam)
  if(state==='slam'){
    drawDdakji(CX,CY+dropY,SZ*0.92,0,['#d8b27a','#9a7638']);
  }

  // 먼지/파편
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life*1.5); ctx.fillStyle=p.c||'#d8c3a0'; ctx.beginPath(); ctx.arc(CX+p.x,CY+p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.restore();

  // "거의…!" 티핑포인트 긴장 연출
  if(state==='flip' && teetering){ const pulse=0.5+0.5*Math.sin(gt*22);
    ctx.save(); ctx.textAlign='center';
    ctx.globalAlpha=0.55+0.45*pulse; ctx.fillStyle='#ffe14d'; ctx.font='900 34px system-ui'; ctx.fillText('거의…!',W/2,H*0.28);
    ctx.globalAlpha=0.8; ctx.fillStyle='#fff'; ctx.font='800 16px system-ui'; ctx.fillText(teetDeg+'°',W/2,H*0.28+26);
    ctx.restore();
  }

  // 충격 플래시
  if(flash>0){ ctx.fillStyle='rgba(255,240,200,'+(flash*0.5)+')'; ctx.fillRect(0,0,W,H); }

  // 파워 바 (ready)
  if(state==='ready'){
    const bw=Math.min(W*0.82,350), bx=(W-bw)/2, by=H*0.78, bh=28;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.45)'; roundRect(bx-4,by-4,bw+8,bh+8,12); ctx.fill();
    roundRect(bx,by,bw,bh,9); ctx.clip();
    const bgr=ctx.createLinearGradient(bx,0,bx+bw,0); bgr.addColorStop(0,'#3a2a18'); bgr.addColorStop(1,'#5a4024');
    ctx.fillStyle=bgr; ctx.fillRect(bx,by,bw,bh);
    const gl=bx+bw*GREEN[0], gw=bw*(GREEN[1]-GREEN[0]);
    ctx.fillStyle='rgba(70,200,110,.55)'; ctx.fillRect(gl,by,gw,bh);                 // 초록=성공
    const pf0=Math.min(0.97,GREEN[0]+(1-GREEN[0])*0.68), pfl=bx+bw*pf0;
    ctx.fillStyle='rgba(255,220,80,.6)'; ctx.fillRect(pfl,by,(bx+bw)-pfl,bh);         // 노랑=완벽
    ctx.restore();
    ctx.fillStyle='rgba(140,255,170,.95)'; ctx.fillRect(gl,by,3,bh);
    const mx=bx+bw*power;
    ctx.save(); ctx.shadowColor='#ffcf5c'; ctx.shadowBlur=10; ctx.fillStyle='#fff'; roundRect(mx-5,by-7,10,bh+14,4); ctx.fill(); ctx.restore();
    ctx.fillStyle='#e9d6bf'; ctx.font='700 11px system-ui';
    ctx.textAlign='left'; ctx.fillText('약',bx+2,by-8); ctx.textAlign='right'; ctx.fillText('강 💥',bx+bw-2,by-8);
    ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='800 12px system-ui'; ctx.fillText('초록=성공 · 노랑=완벽!',bx+bw/2,by+bh+17);
  }
}

let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(state==='start'){ lastTs=ts; return; }
  let dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  update(dt); render();
}
requestAnimationFrame(loop);

    newRound();
  }
}
